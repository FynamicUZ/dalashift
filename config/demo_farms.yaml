# Demo farms for the 5-year planner: Karshi vs Fergana. Climate comes from real NASA POWER data at
# the point; every other input below is HYPOTHETICAL (made up for the demo), labelled as such in the
# app, and editable there (water budget, market limit, must-grow obligation).
karshi:
  point: Karshi_field1             # existing NASA POWER point, Kashkadarya (Karshi steppe), 38.92 N, 65.62 E
  name: {en: "Karshi farm (demo)", uz: "Qarshi fermer xoʻjaligi (demo)"}
  water_budget_m3_ha: 8000         # HYPOTHETICAL: ~8,000 m3/ha net, pumped Amu Darya water (Karshi main canal)
  max_fresh_market_years: 2        # HYPOTHETICAL market limit
  must_grow_pct: {cotton: 0, winter_wheat: 0}   # HYPOTHETICAL: no state-order obligation (switch on in the app)
  note: {en: "Hot cotton-and-wheat district, limited pumped canal water.",
         uz: "Issiq paxta va bugʻdoy hududi, nasos bilan beriladigan kanal suvi cheklangan."}
fergana:
  point: Fergana_field1            # existing NASA POWER point, Fergana valley
  name: {en: "Fergana farm (demo)", uz: "Fargʻona fermer xoʻjaligi (demo)"}
  water_budget_m3_ha: 12000        # HYPOTHETICAL: good canal water supply
  max_fresh_market_years: 2        # HYPOTHETICAL market limit
  must_grow_pct: {cotton: 0, winter_wheat: 0}   # HYPOTHETICAL: no state-order obligation
  note: {en: "Good water supply, mild climate.", uz: "Suv taʼminoti yaxshi, iqlim moʻtadil."}
