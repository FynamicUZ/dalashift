<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DalaShift Video</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<style>
  :root { --bg: #0f1a14; --ink: #faf9f6; --muted: #b9bfb9; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; }
  img.logo { height: 44px; width: auto; }
  video { width: min(960px, 100%); max-height: 75vh; border-radius: 14px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  nav { display: flex; gap: 18px; font-size: 14px; } nav a { color: var(--muted); }
</style>
</head>
<body>
  <img class="logo" src="../img/dalashift_logo_light.png" alt="DalaShift">
  <video src="dalashift.mp4" controls playsinline preload="metadata"></video>
  <nav><a href="../">Open the app</a><a href="../deck/">Pitch deck</a><a href="https://t.me/dalashiftbot">Telegram bot</a></nav>
</body>
</html>
