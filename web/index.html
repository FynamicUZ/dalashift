<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DalaShift</title>
<meta name="description" content="DalaShift: a 5-year crop rotation planner for Uzbek fields, built on NASA data. Team KarPS, NASA Space Apps 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="img/dalashift_logo.png" alt="DalaShift" height="34"></div>
    <div class="seg" id="lang">
      <button data-v="uz" class="on">Oʻzbekcha</button><button data-v="en">English</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="farmer" class="on" data-uz="Fermer" data-en="Farmer">Fermer</button>
    <button data-v="expert" data-uz="Mutaxassislar / For judges &amp; experts" data-en="For judges &amp; experts">Mutaxassislar / For judges &amp; experts</button>
    <a class="decklink" href="deck/index.html" data-uz="Taqdimot" data-en="Pitch deck">Taqdimot</a>
  </nav>
  <main id="farmer"></main>
  <main id="expert" hidden></main>
  <footer class="foot" id="foot"></footer>
</div>
<noscript>DalaShift needs JavaScript to show the plans.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
